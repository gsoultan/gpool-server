# nextar-server configuration.
#
# This file is yours: a package upgrade never overwrites it. Most settings are
# made in /setup and in the UI and are stored in the state database; only what
# the server needs before it can open that database belongs here.

# Address the UI, the API and the agents connect to.
listen: 0.0.0.0:8443

# Where the state database lives. Created by systemd, mode 0700.
data_dir: /var/lib/nextar-server
