name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GO_VERSION: '1.27.4'

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # Fails here, with a clear message, rather than half-way through a release
      # that would then publish unsigned files no installed Nextar would accept.
      - name: Require the signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::The COSIGN_PRIVATE_KEY secret is not set. See README.md, 'Release signing key'."
            exit 1
          fi

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
